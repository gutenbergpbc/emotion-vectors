[project]
name = "gpt-oss-emotion-probes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
extract = ["torch==2.8.0", "transformers==4.57.6", "accelerate>=1.5,<2", "kernels==0.11.7", "huggingface-hub>=0.30,<1"]
modal = ["modal>=1,<2"]
test = ["pytest>=8,<10", "playwright>=1.50,<2"]

[project.scripts]
probe-harness = "probe_harness.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
probe_harness = ["static/*", "*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
