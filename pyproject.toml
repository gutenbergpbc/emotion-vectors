[project]
name = "emotion-vectors"
version = "0.1.0"
description = "Experiment-based replication of emotion-vector monitoring and steering"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "transformers==5.17.0",
  "jinja2>=3.1.6,<4",
  "modal>=1.0,<2",
  "pysbd==0.3.4",
  "scipy==1.17.1",
  "pandas==2.3.3",
  "aiohttp>=3.12,<4",
  "requests>=2.32,<3",
  "pillow>=11,<13",
]

[project.optional-dependencies]
replay = ["torch>=2.8", "accelerate>=1.13", "sentencepiece>=0.2", "protobuf>=5"]
presentation = ["playwright>=1.50", "pymupdf>=1.25"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
